<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full select-none pointer-events-none">
  <defs>
    <!-- Warm Sunlit Parchment Backdrop Circle -->
    <radialGradient id="maleBgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fdf9f1" />
      <stop offset="65%" stop-color="#f1e4cf" />
      <stop offset="100%" stop-color="#e2cfb2" />
    </radialGradient>

    <!-- Warm Espresso Hair & Contour Gradient -->
    <linearGradient id="maleHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b472a" />
      <stop offset="55%" stop-color="#4a2c16" />
      <stop offset="100%" stop-color="#361c0c" />
    </linearGradient>

    <!-- Face Silhouette Gradient (Faceless, Dignified Warm Porcelain Ivory) -->
    <linearGradient id="maleFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf9" />
      <stop offset="55%" stop-color="#f7ecdb" />
      <stop offset="100%" stop-color="#ead7bc" />
    </linearGradient>

    <!-- Formal Sufi Sage-Emerald Suit Gradient -->
    <linearGradient id="maleSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e946d" />
      <stop offset="48%" stop-color="#316b4b" />
      <stop offset="100%" stop-color="#214c34" />
    </linearGradient>

    <linearGradient id="maleCollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#efe3d1" />
    </linearGradient>

    <filter id="maleSilhouetteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#361c0c" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Luminous Parchment Backdrop Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#maleBgGlow)" />
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="rgba(180, 83, 9, 0.28)" stroke-width="1.4" />

  <!-- Masculine Hair Silhouette (Clean, Formal Short Cut with Natural Side Part) -->
  <path d="M50 14 C36 14 31 21 30 30 C28 32 27 36 29 39 C30 40.5 32 41 33 41 C34 46 38 52 45 55.5 C46.5 56.3 48.2 56.8 50 56.8 C51.8 56.8 53.5 56.3 55 55.5 C62 52 66 46 67 41 C68 41 70 40.5 71 39 C73 36 72 32 70 30 C69 21 64 14 50 14 Z" fill="url(#maleHairGrad)" filter="url(#maleSilhouetteShadow)" />

  <!-- Faceless Masculine Face Silhouette (Pure Smooth Elegant Silhouette - NO facial details) -->
  <path d="M50 22 C41 22 36.5 27 36.5 34 C36.5 41 39.5 48.5 46 51.8 C47.3 52.5 48.6 52.8 50 52.8 C51.4 52.8 52.7 52.5 54 51.8 C60.5 48.5 63.5 41 63.5 34 C63.5 27 59 22 50 22 Z" fill="url(#maleFaceGrad)" />

  <!-- Clean Hairline Parting & Temples Definition -->
  <path d="M36.5 31 C38 22 43.5 17.5 50 17.5 C56.5 17.5 62 22 63.5 31 C59.5 24.5 54 22 50 22 C46 22 40.5 24.5 36.5 31 Z" fill="url(#maleHairGrad)" opacity="0.95" />

  <!-- Strong Masculine Neck Silhouette -->
  <path d="M44 51.5 L44 60 C46 61.2 54 61.2 56 60 L56 51.5 Z" fill="url(#maleFaceGrad)" opacity="0.95" />

  <!-- Broad Shoulders & Executive Suit Silhouette -->
  <path d="M50 59.5 C44 59.5 40 56.5 40 56.5 C29 59.5 18 66.5 14 78 C12.8 81.5 15 85 19 85 L81 85 C85 85 87.2 81.5 86 78 C82 66.5 71 59.5 60 56.5 C60 56.5 56 59.5 50 59.5 Z" fill="url(#maleSuitGrad)" filter="url(#maleSilhouetteShadow)" />

  <!-- Formal Shirt Collar Accent (V-neck / Lapel Silhouette) -->
  <path d="M50 67.5 L43 57 C45 58 55 58 57 57 Z" fill="url(#maleCollarGrad)" />
  <path d="M50 67.5 L50 85" stroke="rgba(217, 119, 6, 0.55)" stroke-width="1.5" stroke-linecap="round" />
</svg>
