<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full select-none pointer-events-none">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="femaleBgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2d132c" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Graceful Hijab Outer Veil Gradient -->
    <linearGradient id="hijabOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#db2777" />
      <stop offset="75%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Hijab Inner Cap / Trim Band Gradient -->
    <linearGradient id="hijabBandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>

    <!-- Faceless Female Silhouette Gradient (Pure Smooth Face Oval - NO facial details) -->
    <linearGradient id="femaleFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>

    <!-- Soft Drape Folds Gradient -->
    <linearGradient id="hijabFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <filter id="femaleSilhouetteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#femaleBgGlow)" />
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Outer Hijab Silhouette (Head, Neck & Shoulders Full Coverage) -->
  <path d="M50 12 C34 12 27.5 20 26.5 33 C25.5 42 27.5 50 31.5 58 C23.5 64 16 71 13 79 C11.8 82 14 85 18 85 L82 85 C86 85 88.2 82 87 79 C84 71 76.5 64 68.5 58 C72.5 50 74.5 42 73.5 33 C72.5 20 66 12 50 12 Z" fill="url(#hijabOuterGrad)" filter="url(#femaleSilhouetteShadow)" />

  <!-- Inner Hijab Framing Layer / Under-Cap Opening Contour -->
  <path d="M50 18.5 C38 18.5 33 25.5 33 35.5 C33 45.5 38 53.5 50 53.5 C62 53.5 67 45.5 67 35.5 C67 25.5 62 18.5 50 18.5 Z" fill="url(#hijabBandGrad)" />

  <!-- Faceless Female Face Silhouette (Pure Smooth Dignified Face Oval - NO eyes, nose, or mouth) -->
  <path d="M50 21.5 C41 21.5 36.5 27.5 36.5 35.5 C36.5 43.5 41 50.5 50 50.5 C59 50.5 63.5 43.5 63.5 35.5 C63.5 27.5 59 21.5 50 21.5 Z" fill="url(#femaleFaceGrad)" />

  <!-- Forehead Hijab Under-Cap Band Curve -->
  <path d="M37 28.5 C40 22 45 19.5 50 19.5 C55 19.5 60 22 63 28.5 C59 23.5 54 21.5 50 21.5 C46 21.5 41 23.5 37 28.5 Z" fill="url(#hijabBandGrad)" />

  <!-- Hijab Drape Wrap & Soft Folds Over Neck and Chest (Modest Veiled Drape) -->
  <!-- Upper Chin Wrap Contour -->
  <path d="M34 55.5 C39 52.5 46 51.5 50 51.5 C54 51.5 61 52.5 66 55.5 C62 63.5 57 69.5 50 71.5 C43 69.5 38 63.5 34 55.5 Z" fill="url(#hijabOuterGrad)" opacity="0.95" />

  <!-- Flowing Front Scarf Fold Silhouette & Pleats -->
  <path d="M44 65 C48 67 52 67 56 65 C58 72 56 80 54 85 L46 85 C44 80 42 72 44 65 Z" fill="url(#hijabBandGrad)" opacity="0.75" />
  <path d="M47 66.5 C49 68 51 68 53 66.5 L52 85 L48 85 Z" fill="url(#hijabFoldGrad)" opacity="0.45" />

  <!-- Soft Highlight Lines on Hijab Crown -->
  <path d="M36 21 C40 16 45 14 50 14 C55 14 60 16 64 21" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>